name: Daily Cypress Scraper

on:
  schedule:
    # Runs every day at 10:00 AM UTC (~2-3 AM Pacific)
    - cron: '0 10 * * *'

  # Manual trigger for on-demand refreshes
  workflow_dispatch:

# Allow the job to commit the refreshed cypress_data.json back to the repo
permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    # Make the DB URLs available to every step.
    # DATABASE_URL = runtime/transaction pooler (6543). DIRECT_URL = session pooler (5432),
    # used by `prisma db push` and the seed script for DDL. If DIRECT_URL isn't set as a
    # secret, the code falls back to DATABASE_URL.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fail fast if DATABASE_URL secret is missing
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Node Modules
        run: npm ci

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Python Scraper
        run: python scraper.py

      - name: Verify scrape produced data
        # Guard: never proceed to seed (which wipes the table) with an empty/failed scrape.
        run: |
          COUNT=$(node -e "const d=require('./cypress_data.json'); console.log(Array.isArray(d)?d.length:0)")
          echo "Scraped $COUNT sections."
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::Scraper produced 0 sections. Aborting before the seed wipes the database."
            exit 1
          fi

      - name: Sync database schema (Prisma db push)
        # Ensures the production schema matches prisma/schema.prisma before seeding.
        # This is the step that was missing and caused seeds to fail into local fallback.
        # No --skip-generate: Prisma 7 dropped that flag, and passing it exits 1 before
        # the push runs. The client is generated anyway by the postinstall hook.
        run: npx prisma db push

      - name: Seed the database
        run: npx tsx seed.ts

      - name: Commit refreshed fallback data
        # Keeps the committed cypress_data.json (the app's local fallback catalog) fresh,
        # so even when the DB is briefly unreachable the fallback isn't months stale.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- cypress_data.json; then
            echo "No changes to cypress_data.json."
          else
            git add cypress_data.json
            git commit -m "chore(data): refresh cypress_data.json [skip ci]"
            git push
          fi
